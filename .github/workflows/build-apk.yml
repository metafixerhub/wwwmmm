name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Copy latest index.html to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/CrystalClear-Watermark-Remover.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalClear-Watermark-Remover-APK
          path: build_output/CrystalClear-Watermark-Remover.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.2' }}
          name: "Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.2' }} - Fixed Mobile Download & Save to Gallery"
          body: |
            ### 📱 CrystalClear Video Watermark Remover - v1.1.2 Release
            
            Download the Android APK file below to install and run the app directly on your Android phone!
            
            - **Filename**: `CrystalClear-Watermark-Remover.apk`
            - **Guaranteed Button Action**: Fully resolved the button unresponsive issue with zero-latency 64 KB chunk streaming, resilient JNI type signatures, and direct onclick handlers.
            - **Live Saving Progress & UI Alerts**: Buttons show real-time percentage progress while saving, with clear on-screen confirmation banners upon completion.
            - **Dual MediaStore & Downloads Saving**: Saves clean videos to both `Movies/CrystalClear` (for Gallery / Google Photos) and `Download/CrystalClear` (for Files / Downloads manager).
            - **Native Android Alerts**: Native alert dialogs and toast notifications.
            - **Ultra Speed GPU Inpainting**: Hardware-accelerated forward decode running at 30–60 FPS (zero seek lag).
            - **100% Offline & Private**: Videos never leave your device.
          files: build_output/CrystalClear-Watermark-Remover.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
