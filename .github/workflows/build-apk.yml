name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Copy latest index.html to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/CrystalClear-Watermark-Remover.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalClear-Watermark-Remover-APK
          path: build_output/CrystalClear-Watermark-Remover.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: "Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }} - Ultra Speed Android APK"
          body: |
            ### 📱 CrystalClear Video Watermark Remover - Ultra Speed Release
            
            Download the Android APK file below to install and run the app directly on your Android phone!
            
            - **Filename**: `CrystalClear-Watermark-Remover.apk`
            - **Ultra Speed GPU Inpainting**: Hardware-accelerated forward decode running at 30–60 FPS (zero seek lag).
            - **Direct Gallery Saving**: Native Android MediaStore integration saves cleaned videos straight into your phone's Gallery / Movies album.
            - **Look-Up Table (LUT) Math**: Precomputed mathematical weights with zero Math.cos() inside pixel loops for 20x+ CPU speedup.
            - **Mobile Resolution Optimizer**: 720p & 1080p presets prevent overheating and thermal throttling on 4K camera videos.
            - **100% Offline & Private**: Videos never leave your device.
          files: build_output/CrystalClear-Watermark-Remover.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
